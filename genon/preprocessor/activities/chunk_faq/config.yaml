# 청킹 activity 설정. 파싱 결과(docling 문서 JSON)를 chunk 로 나눔.
# 파일 읽기·OCR·layout·LLM 보강은 parse activity 담당이라 ocr·layout·pdf_pipeline·enrichment 항목이 없음.
# 적지 않은 값은 코드 기본값 사용.
#
# 주석 규칙: 항목 오른쪽 주석과 항목 바로 위(빈 줄 전까지)의 주석이 전처리 Studio 도움말로 표시됨.
# 긴 설명은 빈 줄로 떼어 그 위에 둠.

# 실행 공통 설정
defaults:
  # 로그 상세도. 5=DEBUG 4=INFO(기본) 3=WARNING 2=ERROR 1=CRITICAL 0=끄기
  log_level: 4

# chunk 를 나누는 방법
chunking:
  # chunk_size·chunk_mode·table_as_chunk·include_chunk_header 는 요청 파라미터 값이 우선.
  # docling 문서(PDF·DOCX·HTML 등)가 아닌 일반 텍스트 입력은 아래 recursive 설정으로 나누며,
  # 이때 chunk_size 는 항상 글자 수(0 이하=나누지 않음).

  # chunk 최대 크기. 글자 수(tokenizer_type 이 huggingface 면 token 수). 0=나누지 않음.
  # 0 보다 크고 min_chunk_size 보다 작으면 min_chunk_size 로 올림
  chunk_size: 300
  # 나누는 방식. 바꾸면 chunk 경계가 바뀌어 문서 재적재 필요
  #   section(기본)=섹션 단위, 큰 섹션만 다시 나눔(제목만 있는 chunk 는 이웃과 합침) | section_merge=섹션을 chunk_size 까지 이어 붙이고 큰 섹션은 나눔
  #   character=섹션 무시, 본문을 chunk_size 글자씩 자름(HEADER 줄 없음)
  # chunk_mode: section

  # 표를 별도 chunk 로 만들지. chunk_mode 가 character 이면 미사용
  #   true(기본): 표만 담은 chunk(섹션 제목·캡션·표 설명 포함). 큰 표는 행 단위로 나누고 chunk 마다 헤더 행 반복
  #   false: 표를 앞뒤 본문과 같은 chunk 에 넣음
  table_as_chunk: false
  # chunk 맨 앞에 "HEADER: <섹션 경로>" 줄 추가. true(기본) | false=본문만.
  # 끄면 검색 시 섹션 문맥이 빠짐. chunk_mode 가 character 이면 true 여도 붙이지 않음
  # include_chunk_header: true

  # 검색에 방해되는 글자 정리(문장 내용은 바꾸지 않음). 우선순위: 요청 파라미터 text_cleanup > 이 파일 값 > off
  text_cleanup:
    # safe 정리 대상(표·코드 블록 구조는 유지):
    #   - 분리된 한글 자모 복원, BOM·폭 없는 문자·제어 문자 제거
    #   - NBSP 등 특수 공백은 일반 공백으로, 줄바꿈은 LF 로 통일
    #   - 전각 영숫자는 반각으로, 따옴표·대시 모양 통일
    #   - 줄 끝 공백 제거, 연속 빈 줄은 1개로, 내용 없는 chunk 제거

    # 정리 방식. off(기본)=정리 안 함 | safe=위 목록 정리. 켜면 chunk 본문이 바뀜
    mode: safe
    # 추가 정규식 규칙. mode 가 safe 일 때만, 적은 순서대로 적용
    rules:
      # 줄 맨 앞의 장식용 글머리표 제거(들여쓰기 유지). 대상: •, 도형 기호(■○◇▣▶ 등), 기타 기호(☞ 등). 뒤에 공백과 글자가 올 때만.
      # 뜻이 있는 기호(□☐☑☒ △▲▽▼ ★☆ ♀♂ ☎☏ ※ ❏)와 글 중간의 기호(○○○님)는 유지
      - {find: "(?m)^([ \\t]*)(?:(?![□☐☑☒△▲▽▼★☆♀♂☎☏])[\\u2022\\u25A0-\\u25FF\\u2600-\\u26FF]\\uFE0F?[ \\t]*)+(?<=[ \\t])(?=[^\\W_])", replace: "\\1"}

  # 규칙 작성 예:
  #   text_cleanup:
  #     mode: safe
  #     rules:                                        # 적은 순서대로 적용
  #       - {line: "^\\s*목차\\s*$"}                   # 맞는 줄 삭제
  #       - {find: "\\[이미지[^\\]]*\\]", replace: ""}  # 맞는 부분 치환(replace 생략 시 삭제)
  #       - {chunk: "^본 문서는 참고용"}                # 맞는 chunk 를 통째로 버림
  #
  # line·find 는 chunk 로 나누기 전 본문에 적용(chunk 경계·글자 수에 반영).
  # chunk 는 HEADER 를 붙이기 전 본문으로 판단하며, 레코드(행) 단위 chunk 에는 미적용.
  # 코드 블록(``` 블록, `인라인 코드`)에는 규칙 미적용.
  # 마크다운 표 행을 건너뛰는 것은 line 뿐. find 는 표 안에서도 바꾸므로 `|` 를 지우면 표가 깨짐.
  # `[` `]` 를 지우면 표 설명 앞의 `[표 검색 설명]` 라벨이 깨짐.
  # 잘못된 정규식이나 모르는 키가 있으면 서버 시작 실패. 규칙을 바꾸면 문서 재적재 필요.
  # 실제 문서로 결과를 비교하려면 examples/text_cleanup/ 의 예제 실행.

  # chunk_mode 가 character 일 때만 사용
  # character:
  #   # 이웃 chunk 가 겹치는 글자 수. 기본 0. 늘리면 경계 문맥이 이어지지만 중복 본문 증가.
  #   # 음수면 서버 시작 실패, chunk_size 이상이면 0 으로 처리. 요청 파라미터 character_chunk_overlap 이 우선
  #   chunk_overlap: 0

  # docling 문서가 아닌 일반 텍스트 입력을 글자 수로 나누는 설정(크기는 chunk_size).
  # 음성·csv·xlsx 처럼 문서 하나를 vector 하나로 적재하는 입력과 레코드(행) 단위 chunk 에는 미사용
  # recursive:
  #   # 이웃 chunk 가 겹치는 글자 수. 기본 100(없거나 음수면 100).
  #   # 요청 파라미터 chunk_overlap·recursive_chunk_overlap 이 우선
  #   chunk_overlap: 100

  # 비정상 chunk 검사(내용 없음·너무 짧음·같은 말 반복·깨진 글자).
  # 결과는 로그([chunk_validation])와 성공 응답의 chunk_validation 에 기록. 요청 파라미터로 변경 불가.
  # 판정 기준은 manual/chunking_processor.md 의 "이상 chunk 검증" 절 참고
  validation:
    # 검사 여부. false(기본) | true
    enable: true
    # 기본 검사에 걸린 chunk 의 처리. 기본 report
    #   report: 로그와 응답에만 기록
    #   drop: 그 chunk 만 적재에서 제외(warning 로그). 모든 chunk 가 빠지면 문서 실패
    #   fail: 문서 전체 실패
    action: drop
    # 검사별 처리. 적은 검사는 action 대신 이 값을 따름. disabled(검사 안 함) | report | drop | fail.
    # 두 검사 모두 적지 않으면 검사하지 않으며, 검사 시 HEADER 줄도 포함. 여러 검사에 걸리면 fail > drop > report 순
    checks:
      # 같은 글자가 겹쳐 반복되는 깨짐(무무무무배배배배). 기본 disabled.
      # 모니모는 fail: 문서 유형과 관계없이 문서 처리 중단
      char_stutter: fail
      # 한국어·영어가 아닌 글자가 섞인 깨짐(保険나이, категории별). 기본 disabled.
      # 모니모는 report: 운영 원천의 실제 깨짐 표본이 없어 기록만 함. 중단하려면 fail 로 변경
      foreign_script: report
    # 문서 유형별로 위 값 변경. 적은 키만 바뀌고 checks 는 검사 이름 단위로 바뀜.
    # 파일 하나가 BIZ_ID 하나이고 여러 chunk 로 나뉘는 유형은 일부만 빠지면 내용이 끊기므로 fail(문서 단위 보류).
    # 레코드 하나가 chunk 하나인 유형(menu·term·faq·cs_*·monimo_event·music_ai·stock_insight)은 위 action(drop)대로 걸린 chunk 만 제외
    by_doc_type:
      product_slf: {action: fail}
      product_ssf: {action: fail}
      product_hpp: {action: fail}
      monimo_news: {action: fail}
    # max_chars: chunk 최대 글자 수(HEADER 줄 포함). 넘은 chunk 는 버리지 않고 응답의 chunk_validation.max_length 와 로그로 알림.
    # 적지 않으면 검사 안 함. embedding 모델 입력 한도(token)를 글자 수로 환산한 값보다 조금 낮게 설정
    # max_chars: 7000

# 일반 문서(PDF·DOCX·HTML 등)의 표 모양은 이 파일이 정함(parse 단계 설정은 넘어오지 않음).
# 문서 유형 설정(custom_fields)으로 레코드 단위 chunk 를 만드는 문서는 parse 단계가 chunk 본문을 완성하므로
# activities/parse/config.yaml 의 output.table_format 이 정함.
# 최종 chunk 의 표 모양을 맞추려면 두 파일의 table_format 을 같게 둠(precheck_custom_fields.sh 가 다르면 경고).

# chunk 본문의 표 형식
output:
  # 표 형식. html(기본) | markdown | auto(병합 셀·여러 줄 헤더가 있으면 html, 아니면 markdown).
  # markdown 은 병합 셀을 표현하지 못해 헤더의 상하 관계가 사라짐
  table_format: "markdown"
  # 병합 셀이 있는 표 뒤에 "컬럼=값 | 컬럼=값" 행 문장 추가. false(기본) | true.
  # 값이 어느 헤더에 속하는지 드러나 검색에 유리하지만 chunk 가 커짐. 단순한 표에는 미적용
  table_row_serialization: true
