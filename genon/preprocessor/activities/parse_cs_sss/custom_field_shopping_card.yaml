# 모니모 카드쇼핑 상품 JSONL 레코드
#
# 입력 예시(한 줄에 상품 하나, 확장자는 .jsonl 또는 .json):
#   {"pid": "S230300858907", "mobile_name": "…", "price": 25000, "sale_price": 14400,
#    "discount_amount": 10600, "keywords": [...], "categories": [...], "custom": {"shop_ids": [...]}}
#
# 레코드 하나가 청크 하나다. 줄 단위 JSON 은 읽은 결과가 최상위 배열이므로 records_at 을 적지 않는다.
# 같은 키 이름이 여러 깊이에 있는 원천이다(user_groups[].price, categories[].name). alias 는 얕은
# 깊이부터 찾으므로 최상위 price·sale_price·mobile_name 이 있다는 것이 원천 계약이다.

schema: v2
doc_type: shopping_card
source:
  kind: records
fields:
  BIZ_ID:
    alias: [pid]
  GROUP_C:
    const: HPP
  PRODUCT_NM:
    # name 을 별칭에 넣지 않는다. 최상위에 없으면 categories[].name 이 상품명으로 잡힌다.
    alias: [mobile_name]
  BRAND_C:
    alias: [brand_code]
    default: null
  KEYWORDS:
    # 원천 keywords 에 같은 값(브랜드명 등)이 반복되어 들어오므로 unique 로 지운다.
    alias: [keywords]
    default: null
    transform: [unique, {name: to_json, key: keywords}]
  KEYWORDS_TEXT:
    alias: [keywords]
    meta: false
    transform: [unique]
  CATEGORIES:
    alias: [categories]
    raw: true
    default: null
    transform: [{name: to_json, key: categories}]
  CATEGORY_NM:
    # 분류 이름을 모은다. 경로를 지정할 수 없어 최상위 name(상품명)도 함께 모인다.
    collect: [name]
    meta: false
  SHOP_IDS:
    alias: [shop_ids]
    # 아래 코드만 남김. 하나도 없으면 그 상품은 적재하지 않음. 비워 두면(keep: []) 전부 적재
    keep: [S000000293, S000025345, S000000389]
    transform: [{name: to_json, key: shop_ids}]
  PRICE_AMT:
    # 할인 전 판매가격
    alias: [price]
    default: null
  SALE_PRICE_AMT:
    # 할인 적용 가격
    alias: [sale_price]
    default: null
  DISCOUNT_AMT:
    alias: [discount_amount]
    default: null
  DISCOUNT_RATE:
    # 할인율(정수, %, 내림) = 할인금액 × 100 / 정가. 정가가 0 이거나 값이 없으면 null.
    template: "{{DISCOUNT_AMT}}/{{PRICE_AMT}}"
    transform: percent
  IMAGE_URL:
    alias: [image]
    default: null
  DETAIL_IMAGE_URL:
    alias: [detail_images]
    default: null
    transform: [{name: to_json, key: detail_images}]
  SOLDOUT_YN:
    alias: [is_soldout]
    # values 로는 boolean false 를 접을 수 없어 문자열로 바뀐 값을 치환한다.
    transform:
      - {name: regex_sub, pattern: '^(?i:true)$', repl: "Y"}
      - {name: regex_sub, pattern: '^(?i:false)$', repl: "N"}
  SEARCH_POSSIBLE_YN:
    alias: [search_possible_yn]
    default: null
  CREATED_AT:
    alias: [created_at]
    default: null
  UPDATED_AT:
    alias: [updated_at]
    default: null
require:
  fields: [BIZ_ID, PRODUCT_NM]
body:
  fields: [PRODUCT_NM, CATEGORY_NM, KEYWORDS_TEXT]
  labels:
    PRODUCT_NM: 상품명
    CATEGORY_NM: 카테고리
    KEYWORDS_TEXT: 키워드
