# chunking.validation 설정 샘플.
#
# 각 항목의 chunking 은 chunk_config.yaml 의 `chunking:` 섹션과 같은 모양이다.
#   expect: ok      기동 성공
#   expect: error   기동 실패. error 에 적은 정규식(키 경로)이 메시지에 들어 있어야 한다
#   enabled         기동 성공일 때 검증이 켜지는지

cases:
  - {id: C01, name: 미설정, chunking: {}, expect: ok, enabled: false}
  - {id: C02, name: enable false, chunking: {validation: {enable: false, action: drop}}, expect: ok, enabled: false}
  - {id: C03, name: 검사 끄기, chunking: {validation: {enable: true, checks: {min_chars: disabled}}}, expect: ok, enabled: true}
  - id: C04
    name: 전체 키
    chunking:
      validation:
        enable: true
        action: drop
        checks: {char_stutter: fail, foreign_script: report, min_chars: disabled}
        limits:
          min_chars: {text: 4, row: 0, table: 0}
          repetition: {count: 10, share: 0.5}
          broken_chars: {count: 3, share: 0.3}
          char_stutter: {run: 3}
          foreign_script: {count: 10}
        max_chars: 7000
        by_doc_type:
          product_slf: {action: fail}
          Menu: {action: report, checks: {char_stutter: report}, limits: {min_chars: {text: 0}}}
    expect: ok
    enabled: true
  - {id: C05, name: 음수, chunking: {validation: {enable: true, limits: {min_chars: {text: -1}}}}, expect: error, error: chunking.validation.limits.min_chars.text}
  - {id: C06, name: 정수 자리 bool, chunking: {validation: {enable: true, limits: {repetition: {count: true}}}}, expect: error, error: chunking.validation.limits.repetition.count}
  - {id: C07, name: 문자열, chunking: {validation: {enable: true, limits: {broken_chars: {count: "3"}}}}, expect: error, error: chunking.validation.limits.broken_chars.count}
  - {id: C08, name: 1.5 비율, chunking: {validation: {enable: true, limits: {repetition: {share: 1.5}}}}, expect: error, error: chunking.validation.limits.repetition.share}
  - {id: C09, name: 모르는 키, chunking: {validation: {enable: true, check: {}}}, expect: error, error: chunking.validation.check}
  - {id: C10, name: 모르는 action, chunking: {validation: {enable: true, action: delete}}, expect: error, error: chunking.validation.action}
  - {id: C11, name: doc_type 값이 object 가 아님, chunking: {validation: {enable: true, by_doc_type: {faq: 0}}}, expect: error, error: chunking.validation.by_doc_type.faq}
  - {id: C12, name: doc_type 안의 잘못된 값, chunking: {validation: {enable: true, by_doc_type: {faq: {checks: {min_chars: skip}}}}}, expect: error, error: chunking.validation.by_doc_type.faq.checks.min_chars}
  - {id: C13, name: enable 이 bool 이 아님, chunking: {validation: {enable: "yes"}}, expect: error, error: chunking.validation.enable}
  - {id: C14, name: 블록이 object 가 아님, chunking: {validation: true}, expect: error, error: chunking.validation}
  - {id: C15, name: 모르는 검사, chunking: {validation: {enable: true, checks: {stutter: fail}}}, expect: error, error: chunking.validation.checks.stutter}
  - {id: C16, name: 반복 횟수 1, chunking: {validation: {enable: true, limits: {char_stutter: {run: 1}}}}, expect: error, error: chunking.validation.limits.char_stutter.run}
  # yaml 은 따옴표 없는 off 를 false 로 읽는다
  - {id: C17, name: 처리 값이 bool, chunking: {validation: {enable: true, checks: {foreign_script: off}}}, expect: error, error: chunking.validation.checks.foreign_script}
  # 없앤 키는 새 위치를 알린다. enable false·by_doc_type 안에서도 같다
  - {id: C18, name: 없앤 키, chunking: {validation: {enable: false, fail_on_any: true}}, expect: error, error: "chunking.validation.fail_on_any: .*action: fail"}
  - {id: C19, name: doc_type 안의 없앤 키, chunking: {validation: {enable: true, by_doc_type: {faq: {min_chars: 0}}}}, expect: error, error: "by_doc_type.faq.min_chars: .*limits.min_chars.text"}
  - {id: C20, name: 상한 0, chunking: {validation: {enable: true, max_chars: 0}}, expect: error, error: chunking.validation.max_chars}
