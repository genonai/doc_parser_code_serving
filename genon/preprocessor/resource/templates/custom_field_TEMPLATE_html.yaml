# ═══════════════════════════════════════════════════════════════════════════
#  템플릿 — 원문 HTML 에서 CSS selector 로 추출 (source.kind: html)
#
#  용도      : 뽑을 값이 원천 마크업의 class 나 속성으로 정확히 지목되어 있을 때
#              (CMS 상세 페이지, 크롤링 결과 등).
#  결과      : 문서에서 나온 모든 청크에 같은 값이 metadata 로 붙는다. 청크 본문은 문서
#              파서(docling)가 만든다.
#  LLM 호출  : 없음(CSS selector 가 값을 만든다).
#              표 설명을 켜면 별도로 호출한다.
#
#  ── 작성 순서 ────────────────────────────────────────────────────────────
#  ① 이 파일을 parse activity 설정 폴더(config.yaml 이 있는 폴더)에 custom_field_<유형>.yaml 로
#     복사한다.
#  ② <...> 를 채우고 쓰지 않는 [선택] 블록은 지운다. `schema: v2` 줄은 지우지 않는다(없으면 기동 실패).
#  ③ 이 파일 최상위에 `doc_type: <유형>` 한 줄을 적는다. 이 한 줄이 등록이고 파일을 지우면 빠진다
#     (Studio 의 문서유형 추가도 이 방식이다). 같은 설정 폴더를 읽는 모든 처리기에 등록되며,
#     처리기 설정(config.yaml 등)에는 아무것도 적지 않는다. extractor 도 적지 않는다(source.kind 로 정해진다).
#
#  ── 주의 사항 ────────────────────────────────────────────────────────────
#  CSS selector 는 파싱 전 원문 HTML 에 적용된다. 원천은 다음 둘 중 하나여야 한다.
#   · `.html`·`.htm` 파일
#   · `.json` 파일이고 그 안의 값이 HTML 인 경우(아래 `source.pre.json.body_from` 필수)
# ═══════════════════════════════════════════════════════════════════════════

schema: v2

# ── [필수] 소스 ─────────────────────────────────────────────────────────────
source:
  kind: html

  # ── [선택] 원천 전처리 (원천이 .json 이면 json 은 필수) ───────────────────
  # 문서를 파싱하기 전에 적용할 전처리 규칙이다.
  # pre:
  #   marker_headings: true         # `◈ 기본내용` 처럼 기호로만 계층을 표현한 줄을 heading 으로
  #                                 # 바꿔 청크 경계를 만든다
  #   json:                         # 원천이 .json 이고 본문 HTML 이 그 안의 값일 때
  #     # 본문 HTML 이 담긴 key 이름들. 경로가 아니라 이름만 적는다(`data.html.content` → `content`).
  #     # 꺼낸 항목은 HTML 문서 하나로 합쳐지고, CSS selector 는 이 합친 HTML 에 적용된다.
  #     body_from: [<본문_KEY>]       # [필수]
  #     format: auto                # auto(기본, 블록 HTML 태그와 Markdown 표식으로 판정) | html | markdown
  #     on_missing: skip            # body_from 의 key 가 없을 때. skip(기본) = 경고 후 빈 문서로 진행
  #                                 # / error = 요청 실패

# ── [필수] 필드 ─────────────────────────────────────────────────────────────
# 왼쪽은 목표필드명이며 적재 DB 컬럼명(대문자)으로 쓴다. 선언한 필드는 값을 찾지 못해도 null 로 남는다.
#
# 예시:
fields:
  <TITLE>:
    select: <.제목_class>
  <CATEGORY>:
    # 값이 요소의 속성에 있으면 attr 를 함께 적는다.
    select: <.바깥_wrap_class>
    attr: <속성이름>
  <DETAIL>:
    select: <.본문_class>
  # 원천에 없어 selector 로 뽑지 못하는 값은 select 없이 선언한다.
  <GROUP_C>:
    const: <고정값>
  <BIZ_ID>:
    default: null                   # 선언만 해도 null 로 남으므로 이 줄은 생략해도 된다
  # 파일명에서 식별자를 잘라낸다.
  # <DOC_ID>:
  #   alias: [$file]
  #   transform: {name: regex_extract, pattern: '<파일명 정규식>'}

# 옵션 설명:
#   select    : 값이 있는 요소의 CSS selector(`.new-banner-headline`, `#detail > p` 등). 처음 일치한
#               요소 하나의 안쪽을 평문으로 바꿔 쓴다(표는 행·열 구조를 남긴다).
#   attr      : 값이 텍스트가 아니라 요소의 속성에 있을 때 select 와 함께 쓴다.
#   alias     : `alias: [$file]`(입력 파일명, 요청의 org_filename 우선)만 쓸 수 있으며, 필요한 부분은 regex_extract 로 잘라낸다
#               (TD00008415_d_5199.html.json → pattern '^(TD\d+)' → TD00008415).
#   const     : 항상 이 값을 쓴다. selector 가 가져온 값보다 우선한다.
#   default   : selector 가 값을 주지 못했을 때만 채운다.
#   values    : 값의 표기를 표준값으로 통일한다. 형식은 `표준값: [별칭…]` 이며 표준값 자신도 별칭이다.
#               대소문자·공백·`_-./`·전각/반각 차이는 무시하고 비교한다. 목록에 없는 값은 원래 값을
#               두고 경고만 남긴다. 영문 yes/no/on/off 별칭은 따옴표로 감싼다(YAML 이 true/false 로 읽는다).
#   transform : 값 변환. 아래 [변환기] 참고.
#   template  : 여러 필드를 합쳐 새 필드를 만든다(`"{{GROUP_C}}-{{DOC_ID}}"`).
#               select 로 뽑은 필드는 재료로 쓸 수 없고 const·default·`$file` 필드만 쓴다.
#   pack      : 여러 필드를 JSON 객체 문자열 하나로 묶는다(`[A, B]` → `{"A": ..., "B": ...}`).
#               select 로 뽑은 필드는 재료로 쓸 수 없고, 본문 키(repeat·once·mirror_to)에도 쓸 수 없다.
#   meta      : false 면 적재 컬럼에서만 뺀다(기본 true). template·pack 재료로만 쓰는 필드에 적는다.
#
# [변환기] 인자는 `{name: <이름>, <인자>: <값>}` 으로 적는다.
#   date_int       on_error=0                        날짜 → YYYYMMDD 정수("2026-07-01"·"26.07.01"·"260701").
#                                                    빈 값은 항상 0, 해석 실패는 on_error
#   normalize                                        전각·반각 통일, 공백 정리, 소문자화(중복 판정 키용.
#                                                    영문이 소문자가 되므로 표시용 값에는 쓰지 않는다)
#   to_text                                          JSON·HTML 을 표·목록 구조를 살린 평문으로 바꾼다
#   regex_sub      pattern, repl=""                  정규식 치환
#   regex_extract  pattern, group=1, on_error=null   정규식 추출. 일치하지 않으면 on_error
#   to_int         on_error=null                     "18,000원" → 18000. 소수이거나 숫자가 둘 이상이면 on_error
#   percent                                          "분자/분모" → 백분율 정수(내림). "10600/25000" → 42
#   unique                                           목록에서 같은 값을 지움(처음 나온 순서 유지). 목록이 아니면 그대로
#   hash           length=16, prefix=""              해시코드로 변환(SHA-1)
#   truncate       length, suffix=""                 길이 자르기
#   to_json        on_scalar=wrap|drop, key="value"  JSON 컬럼용 문자열. 단일 값은 wrap(기본)이면 {key: 값},
#                                                    drop 이면 null. 목록 맨 뒤에만 두며 본문 키·pack 재료로
#                                                    쓸 수 없다
#
# ── [참고] 값 적용 순서 ──────────────────────────────────────────────────────
#   우선순위(오른쪽이 우선): default < selector < 파일명 < const

# ── [선택] 청크 본문 ────────────────────────────────────────────────────────
# 예시:
# body:
#   labels:
#     <CATEGORY>: <항목명>
#     <TITLE>: <항목명>
#   repeat:    [<TITLE>]
#   once:      [<CATEGORY>, <TITLE>]
#   mirror_to: [<BODY_COLUMN>]
#
# 옵션 설명:
#   labels    : repeat·once 값 앞에 붙일 항목명(`항목명: 값`). 없으면 값만 붙는다.
#   repeat    : 모든 청크 본문 앞에 붙일 필드(청크마다 단독으로 검색되어야 하는 식별자)
#   once      : 첫 청크에만 붙일 필드(문서 분류·작성일 등). 원문에 있는 같은 값은 그대로 남는다.
#   mirror_to : 청크 본문(text)과 같은 값을 받을 필드(검색 대상 본문 컬럼용)
# repeat·once 는 붙인 만큼 chunk_size 를 차지하므로 짧은 필드 1~2개로 제한한다. 빈 값이나 객체 값은
# 건너뛴다. once 로만 붙인 값은 embedding 검색에서 첫 청크만 검색되지만, 값은 모든 청크의
# metadata 에 실리므로 모든 청크에서 필터 검색할 수 있다.
# 본문은 문서 파서가 만들므로 `body.fields`·`body.split` 은 쓸 수 없다.

# ── [선택] 이 문서유형의 표 설명 설정(table_text_description) ───────────────
# 본문의 표(HTML·마크다운 표)마다 LLM 으로 검색용 설명을 만들어 표 앞에 붙이는 기능이다.
# config.yaml 공통 설정의 `table_text_description` 에 여기 적은 키만 덮어쓰고(`rag`·`skip` 안의 키도 하나씩 덮어쓴다),
# 적지 않은 키는 공통 설정 값을 그대로 쓴다.
# `enable`(기본 false)로 켜고 끈다. 요청 파라미터 table_text_desc 가 있으면 그 값이 우선한다.
# `skip` 으로 LLM 에 보내지 않을 표 종류를 정한다(종류와 기준은 config.yaml 의 table_text_description 주석 참고).
# html 방식은 LLM 을 호출하지 않으므로 표 설명용 연결(model_preset 등)을 공통 설정이나 이 블록에 적어야 한다.
# table_text_description:
#   enable: true
#   prompt_template_file: prompt_table_text_description_rag.md   # 표 설명 프롬프트 파일(같은 폴더 기준)
#   before_items: 4                   # 표 앞에서 문맥으로 가져올 본문 항목 수(기본 3)
#   after_items: 3                    # 표 뒤에서 문맥으로 가져올 본문 항목 수(기본 2)
#   skip:
#     self_describing_table: true     # 제목이 있고 값이 문장인 작은 표
#     long_text_table: 100            # 값 칸 평균 글자 수가 이 값 이상인 표(0 이면 끔)
#   rag:
#     key_fact_limit: 5               # 표에서 뽑을 핵심 사실 최대 개수(기본 3)
#     search_terms: 3                 # 청크에 실을 검색어 수(0 이면 만들지 않음)
