# ═══════════════════════════════════════════════════════════════════════════
#  템플릿 — 서술형 문서의 LLM 추출 (source.kind: document)
#
#  용도      : 서술형 문서 포맷(txt/md/pdf/docx/hwp/html/pptx)이고, 문서 하나에서 필드 몇 개를
#              뽑을 때(상품설명서의 상품명·상품코드, 카드 혜택 요약 등).
#              행이나 레코드마다 값이 다르면 rows/records 를 쓴다.
#  결과      : 문서에서 나온 모든 청크에 같은 값이 metadata 로 붙는다. 청크 본문은 문서
#              파서(docling)가 만든다.
#  LLM 호출  : 문서당 1회.
#              표 설명은 이 호출에 합치거나 별도로 호출한다(아래 표 설명 블록 참고).
#
#  ── 작성 순서 ────────────────────────────────────────────────────────────
#  ① 이 파일을 parse activity 설정 폴더(config.yaml 이 있는 폴더)에 custom_field_<유형>.yaml 로
#     복사한다.
#  ② <...> 를 채우고 쓰지 않는 [선택] 블록은 지운다. `schema: v2` 줄은 지우지 않는다(없으면 기동 실패).
#  ③ 이 파일 최상위에 `doc_type: <유형>` 한 줄을 적는다. 이 한 줄이 등록이고 파일을 지우면 빠진다
#     (Studio 의 문서유형 추가도 이 방식이다). 같은 설정 폴더를 읽는 모든 처리기에 등록되며,
#     처리기 설정(config.yaml 등)에는 아무것도 적지 않는다. extractor 도 적지 않는다(source.kind 로 정해진다).
# ═══════════════════════════════════════════════════════════════════════════

schema: v2

# ── [필수] 소스 ─────────────────────────────────────────────────────────────
source:
  kind: document

  # ── [선택] 원천 전처리 (md / html) ────────────────────────────────────────
  # 문서를 파싱하기 전에 적용할 전처리 규칙이다.
  # pre:
  #   marker_headings: true             # `◈ 기본내용` 처럼 기호로만 계층을 표현한 줄을 heading 으로
  #                                     # 바꿔 청크 경계를 만든다(md·html 양쪽에 적용)
  #   markdown:
  #     front_matter:                   # 문서 앞의 YAML front matter 를 본문에서 분리한다
  #       # 어느 키에서 값을 가져올지는 아래 `fields.<목표>.alias` 에 적는다.
  #       exclude_text_fields: ["*"]    # "*" = front matter 전체를 검색 본문에서 제외
  #       max_bytes: 65536              # front matter 로 읽을 앞부분 바이트 상한
  #     text_fence: true                # ```text 코드 블록을 일반 단락으로 되돌린다(chunk_size 로
  #                                     # 나뉘게 한다). 세부 옵션은 아래처럼 적는다
  #     # text_fence: {enable: true, langs: ["", "text"], min_hangul_ratio: 0.3}

# ── [선택] 필드 ─────────────────────────────────────────────────────────────
# 값의 원천은 LLM 응답(`llm.out`), markdown front matter, 입력 파일명 세 가지다.
# 왼쪽은 목표필드명이며 적재 DB 컬럼명(대문자)으로 쓴다.
#
# 예시:
# fields:
#   <GROUP_C>:     {const: "<고정값>"}
#   <BIZ_ID>:      {alias: [$file], transform: {name: regex_extract, pattern: '<파일명 정규식>'}}
#   created_date:  {alias: [created_at], transform: date_int}       # 예약 이름. front matter 작성일
#   <PRODUCT_C>:   {alias: [product_code, prod_cd]}                  # front matter, 없으면 LLM 값
#   <SALE_STATUS>: {alias: [sale_state], values: {SALE: ["1"], STOP: ["0"]}}
#   <VALID_TO>:    {default: 99991231, transform: {name: date_int, on_error: 99991231}}   # LLM·front matter 값을 변환한다
#   <DISPLAY_NM>:  {template: "{{<TARGET_FIELD_1>}} {{<TARGET_FIELD_2>}}"}   # llm.out 이나 위에서 선언한 필드만 쓸 수 있다
#
# 옵션 설명:
#   alias     : front matter 키 이름들. 적은 이름과 정확히 같은 키만 찾고 앞에 적은 것이 우선한다.
#               `alias: [$file]` 이면 입력 파일명(요청의 org_filename 우선)을 값으로 쓴다. 다른 별칭과
#               섞을 수 없으며, 필요한 부분은 regex_extract 로 잘라낸다
#               (상품_20260112_요약서.md → pattern '^(상품_\d{8})' → 상품_20260112).
#   const     : 항상 이 값을 쓴다. LLM·front matter 값보다 우선한다.
#   default   : LLM·front matter·파일명이 값을 주지 못했을 때만 채운다.
#   values    : 값의 표기를 표준값으로 통일한다. 형식은 `표준값: [별칭…]` 이며 표준값 자신도 별칭이다.
#               대소문자·공백·`_-./`·전각/반각 차이는 무시하고 비교한다. 목록에 없는 값은 원래 값을
#               두고 경고만 남긴다. 영문 yes/no/on/off 별칭은 따옴표로 감싼다(YAML 이 true/false 로 읽는다).
#   transform : 값 변환. 아래 [변환기] 참고.
#   template  : 여러 필드를 합쳐 새 필드를 만든다(`"{{L1}} > {{L2}}"`).
#   pack      : 여러 필드를 JSON 객체 문자열 하나로 묶는다(`[A, B]` → `{"A": ..., "B": ...}`).
#               이미 JSON 문자열이므로 to_json 을 덧붙이지 않는다. `llm.out` 필드도 묶을 수 있다.
#               본문 키(repeat·once·mirror_to)에는 쓸 수 없다.
#   meta      : false 면 적재 컬럼에서만 뺀다(기본 true). template·pack 재료로만 쓰는 필드에 적는다.
#
# [변환기] 인자는 `{name: <이름>, <인자>: <값>}` 으로 적는다.
#   date_int       on_error=0                        날짜 → YYYYMMDD 정수("2026-07-01"·"26.07.01"·"260701").
#                                                    빈 값은 항상 0, 해석 실패는 on_error
#   normalize                                        전각·반각 통일, 공백 정리, 소문자화(중복 판정 키용.
#                                                    영문이 소문자가 되므로 표시용 값에는 쓰지 않는다)
#   to_text                                          JSON·HTML 을 표·목록 구조를 살린 평문으로 바꾼다
#   regex_sub      pattern, repl=""                  정규식 치환
#   regex_extract  pattern, group=1, on_error=null   정규식 추출. 일치하지 않으면 on_error
#   to_int         on_error=null                     "18,000원" → 18000. 소수이거나 숫자가 둘 이상이면 on_error
#   percent                                          "분자/분모" → 백분율 정수(내림). "10600/25000" → 42
#   unique                                           목록에서 같은 값을 지움(처음 나온 순서 유지). 목록이 아니면 그대로
#   hash           length=16, prefix=""              해시코드로 변환(SHA-1)
#   truncate       length, suffix=""                 길이 자르기
#   to_json        on_scalar=wrap|drop, key="value"  JSON 컬럼용 문자열. 단일 값은 wrap(기본)이면 {key: 값},
#                                                    drop 이면 null. 목록 맨 뒤에만 두며 본문 키·pack 재료로
#                                                    쓸 수 없다
#
# ── [참고] 값 적용 순서 ──────────────────────────────────────────────────────
#   우선순위(오른쪽이 우선): default < LLM 응답 < front matter·파일명 < const

# ── [선택] 청크 본문 ────────────────────────────────────────────────────────
# 예시:
# body:
#   labels:
#     <IDENTIFIER_FIELD>: <항목명>
#   repeat:    [<IDENTIFIER_FIELD>]
#   once:      [<CATEGORY_FIELD>]
#   mirror_to: [<BODY_COLUMN>]
#
# 옵션 설명:
#   labels    : repeat·once 값 앞에 붙일 항목명(`항목명: 값`). 없으면 값만 붙는다.
#   repeat    : 모든 청크 본문 앞에 붙일 필드(청크마다 단독으로 검색되어야 하는 식별자)
#   once      : 첫 청크에만 붙일 필드(문서 분류·작성일 등). 원문에 있는 같은 값은 그대로 남는다.
#   mirror_to : 청크 본문(text)과 같은 값을 받을 필드(검색 대상 본문 컬럼용)
# repeat·once 는 붙인 만큼 chunk_size 를 차지하므로 짧은 필드 1~2개로 제한한다. 빈 값이나 객체 값은
# 건너뛴다. once 로만 붙인 값은 embedding 검색에서 첫 청크만 검색되지만, 값은 모든 청크의
# metadata 에 실리므로 모든 청크에서 필터 검색할 수 있다.

# ── [선택] LLM 추출 ─────────────────────────────────────────────────────────
# 문서 1건당 1회 호출하며 입력은 문서 본문이다.
# out 이름은 프롬프트가 요구하는 JSON 키와 정확히 같아야 한다. 다르면 오류 없이 null 이 된다.
# 프롬프트 변수: raw_text(문서 본문), full_text, filename, mimetype, page_count, table_count,
#   picture_count, section_headers 와 `prompt.variables` 에 정의한 변수. 그 밖의 `{{변수}}` 를 쓰면
#   기동이 실패한다. 파일명에서 값을 뽑을 때는 `{{filename}}` 대신 `fields` 의 `alias: [$file]` 을 쓴다.
# system 을 생략하면 기본 프롬프트가 쓰인다. 프롬프트에는 값이 없으면 null 을 출력하라는 지시와,
# 비슷해 보이는 오답(상품명 속 괄호 숫자를 상품코드로 읽는 것 등)을 막는 규칙을 적는다.
llm:
- out: [<TARGET_FIELD_1>, <TARGET_FIELD_2>]

  # ── 입력 페이지 범위 ─────────────────────────────────────────────────────
  # null(기본)이면 문서 전체. 앞쪽 몇 페이지로 충분하면 `pages: [1, 2, 3]` 처럼 목록으로 적는다.
  pages: null

  # ── 응답 파서 ────────────────────────────────────────────────────────────
  # json(기본) = 응답에서 JSON 객체를 찾아 쓴다(코드펜스·앞뒤 설명 문구가 있어도 된다).
  # Python 함수로 넘길 수도 있다: parser: {type: python, file: custom_field_<유형>.py, callable: parse}
  parser:
    type: json

  # ── LLM 연결 ─────────────────────────────────────────────────────────────
  # 접속 정보는 model_presets.yaml 의 이름을 사용한다.
  # model_preset 을 적지 않으면 경고를 남기고 LLM 호출만 건너뛴다. front matter·파일명·const·default 값은 그대로 만든다.
  endpoint:
    model_preset: default

  # ── 생성 파라미터 ────────────────────────────────────────────────────────
  # 생략 시 max_tokens 1000 / temperature 0.0 / timeout 60.
  # 문서 전체를 넣으면 입력이 길어지므로 max_tokens·timeout 을 넉넉히 잡아야 한다.
  # thinking·top_p·seed·repetition_penalty·headers 도 여기 적는다.
  params:
    max_tokens: 4000
    temperature: 0.0
    timeout: 300
    # params: {top_k: 20}             # 모델 공급자 전용 값은 안쪽 params 에 적는다

  prompt:
    # 쓸 수 있는 키: system, user, system_file, user_file(파일명, 같은 폴더 기준), variables(사용자 변수),
    # mode(변수 검사 방식, strict 기본 | lenient). 그 밖의 키를 적으면 기동이 실패한다.
    # variables: {<MY_VAR>: "<값>"}
    # mode: strict
    system: |
      너는 <문서 종류> 정보추출 전문가다. 주어진 문서에서 요청한 필드를 정확하게 추출한다.

      규칙:
      - 반드시 하나의 JSON 객체만 반환한다. 설명 문구·마크다운 코드펜스 없이 순수 JSON 만 출력한다.
      - 키는 아래 필드명을 그대로 쓴다.
      - 원문에 없는 정보를 지어내지 않는다(환각 금지). 없으면 값을 null 로 둔다.
      - `<TARGET_FIELD_1>`: <무엇을, 어디서, 어떤 형태로 뽑을지>
      - `<TARGET_FIELD_2>`: <무엇을, 어디서, 어떤 형태로 뽑을지>

      출력 예시 형식(값은 예시):
      {"<TARGET_FIELD_1>": "<예시 값>", "<TARGET_FIELD_2>": "<예시 값>"}
    user: |
      아래 문서에서 다음 필드를 추출하라.

      - <TARGET_FIELD_1> (<설명>)
      - <TARGET_FIELD_2> (<설명>)

      반드시 위 키를 모두 가진 하나의 JSON 객체로만 반환하라.

      <document>
      {{raw_text}}
      </document>

# ── [선택] 이 문서유형의 표 설명 설정(table_text_description) ───────────────
# 본문의 표(HTML·마크다운 표)마다 LLM 으로 검색용 설명을 만들어 표 앞에 붙이는 기능이다.
# config.yaml 공통 설정의 `table_text_description` 에 여기 적은 키만 덮어쓰고(`rag`·`skip` 안의 키도 하나씩 덮어쓴다),
# 적지 않은 키는 공통 설정 값을 그대로 쓴다.
# `enable`(기본 false)로 켜고 끈다. 요청 파라미터 table_text_desc 가 있으면 그 값이 우선한다.
# `skip` 으로 LLM 에 보내지 않을 표 종류를 정한다(종류와 기준은 config.yaml 의 table_text_description 주석 참고).
# LLM 연결(model_preset 등)을 여기 따로 적으면 별도로 호출하고, 없으면 위 llm 연결로 필드 추출과
# 함께 요청한다.
# table_text_description:
#   enable: true
#   prompt_template_file: prompt_table_text_description_rag.md   # 표 설명 프롬프트 파일(같은 폴더 기준)
#   before_items: 4                   # 표 앞에서 문맥으로 가져올 본문 항목 수(기본 3)
#   after_items: 3                    # 표 뒤에서 문맥으로 가져올 본문 항목 수(기본 2)
#   skip:
#     self_describing_table: true     # 제목이 있고 값이 문장인 작은 표
#     long_text_table: 100            # 값 칸 평균 글자 수가 이 값 이상인 표(0 이면 끔)
#   rag:
#     key_fact_limit: 5               # 표에서 뽑을 핵심 사실 최대 개수(기본 3)
#     search_terms: 3                 # 청크에 실을 검색어 수(0 이면 만들지 않음)
