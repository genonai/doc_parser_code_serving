# ═══════════════════════════════════════════════════════════════════════════
#  템플릿 — JSON 레코드별 매핑 (source.kind: records)
#
#  용도      : 원천이 .json(또는 구분자 텍스트)이고 레코드 배열 한 요소가 검색 결과 한 건일 때
#              (이벤트 목록, 관심소식, FAQ JSON, 링크 목록 등).
#  결과      : 레코드 1개가 청크 1개가 되고, 아래 목표필드가 그 청크의 metadata 로 실린다.
#              `body.split: true` 이면 chunk_size 를 넘는 레코드만 여러 청크로 나뉜다.
#  LLM 호출  : 없음. 원천에 없는 필드가 필요할 때만 아래 `llm` 블록을 쓴다(레코드 1건당 1회).
#
#  ── 작성 순서 ────────────────────────────────────────────────────────────
#  ① 이 파일을 parse activity 설정 폴더(config.yaml 이 있는 폴더)에 custom_field_<유형>.yaml 로
#     복사한다.
#  ② <...> 를 채우고 쓰지 않는 [선택] 블록은 지운다. `schema: v2` 줄은 지우지 않는다(없으면 기동 실패).
#  ③ 이 파일 최상위에 `doc_type: <유형>` 한 줄을 적는다. 이 한 줄이 등록이고 파일을 지우면 빠진다
#     (Studio 의 문서유형 추가도 이 방식이다). 같은 설정 폴더를 읽는 모든 처리기에 등록되며,
#     처리기 설정(config.yaml 등)에는 아무것도 적지 않는다. extractor 도 적지 않는다(source.kind 로 정해진다).
#
#  ── 주의 사항 ────────────────────────────────────────────────────────────
#  · 한 파일에 성격이 다른 배열이 여럿이면(예: `faqList` 와 `noticeList`) 이 설정을 배열마다 하나씩
#    만들어 각각 최상위에 같은 `doc_type:` 을 적고, `records_at` 에 서로 다른 배열을 적는다.
# ═══════════════════════════════════════════════════════════════════════════

schema: v2

# ── [필수] 소스 ─────────────────────────────────────────────────────────────
source:
  kind: records

  # ── [선택] 레코드 배열이 담긴 key ─────────────────────────────────────────
  # key 이름만 적는다(깊이와 무관하게 찾는다). 예: {"data": {"eventList": [{...}, {...}]}} → eventList
  # 생략하면 배열을 자동으로 고르며 고른 배열은 로그에 남는다.
  # records_at: <배열_KEY>

  # ── [선택] records_at 을 찾지 못했을 때 ───────────────────────────────────
  # error(기본) = 요청 실패 / skip = 경고 후 0건
  # on_missing: skip

  # ── [선택] 원천이 JSON 이 아니라 구분자 텍스트일 때 ───────────────────────
  # 각 줄을 레코드 하나로 읽는다. `columns` 에 적은 이름이 `fields.<목표>.alias` 가 찾는 key 가 된다.
  # pre:
  #   delimited:
  #     separator: "|@|"                     # [필수] 필드 구분자. 여러 글자도 된다
  #     columns: [대분류, 중분류, 제목, 내용]  # [필수] 줄에 오는 순서대로 이름을 적는다
  #     quote: '"'                           # 구분자를 포함한 값을 감싸는 글자(기본값)
  #     encoding: utf-8                      # 생략 시 utf-8-sig → utf-8 → cp949 순으로 판정
  #     skip_header: false                   # 첫 줄이 헤더면 true(기본 false)

  # ── [선택] 여러 레코드에 나뉘어 온 값을 한 건으로 합치기 ──────────────────
  # 원천이 값 하나(주로 JSON 문자열)를 여러 레코드에 나눠 보낼 때만 쓴다. 이름은 목표필드명으로 적는다.
  # merge_rows:
  #   group_by:  [<TARGET_FIELD_1>]   # 이 값이 같은 레코드를 한 묶음으로 합친다(떨어져 있어도 된다)
  #   part_by:   <TARGET_FIELD_4>     # 선택. 묶음 안에서 값을 나누는 기준. 나뉜 값이 둘 이상이면 모두 JSON 일 때
  #                                   #   [문서1, 문서2] 배열로, 아니면 줄바꿈으로 합친다
  #   order_by:  <TARGET_FIELD_2>     # 합칠 순서(숫자면 숫자 순, 미지정 시 원본 순서)
  #   concat:    [<TARGET_FIELD_3>]   # 순서대로 이어 붙일 필드
  #   separator: ""                   # 기본값. 문자 단위로 잘려 온 값이면 빈 문자열로 둔다

# ── [필수] 필드 ─────────────────────────────────────────────────────────────
# 왼쪽은 목표필드명이며 적재 DB 컬럼명(대문자)으로 쓴다. 값은 항상 object 로 적는다.
#
# 예시(왼쪽 <...> 는 목표필드명, alias 안은 원천 key 이름):
fields:
  <TARGET_FIELD_1>:
    alias: [<json key>, <다른 표기>]
  <TARGET_FIELD_2>:
    alias: [<json key>]
    transform: date_int

  # <SEARCHABLE_YN>:
  #   alias:   [노출여부]
  #   values:  {"Y": [노출, 사용], "N": [미노출, 미사용]}
  #   default: "N"
  #
  # <GROUP_C>:       {const: "<고정값>"}
  # <BIZ_ID>:        {alias: [id], default: null}   # 원천에 없으면 null 로 출력
  # <DOC_ID>:                                       # 파일명 TD00008415_d_5199.html.json → TD00008415
  #   alias: [$file]
  #   transform: {name: regex_extract, pattern: '^(TD\d+)'}
  # <REPEATED_URLS>: {collect: [serviceUrl]}
  # 같은 key 를 두 필드에 붙여 원본 HTML(적재 컬럼)과 평문(본문용)을 함께 만든다.
  # <DETAIL_HTML>:   {alias: [htmlText, 상세내용]}
  # <DETAIL_TEXT>:   {alias: [htmlText, 상세내용], transform: to_text}
  # 원본이 필요 없으면 한 필드로 쓴다.
  # <DETAIL>:        {alias: [htmlText], transform: to_text}
  # <DISPLAY_NM>:    {template: "{{<TARGET_FIELD_1>}} {{<TARGET_FIELD_2>}}"}
  # <ROW_NO>:        {seq: {prefix: "FAQ-", width: 4}}   # FAQ-0001, FAQ-0002 …

# 옵션 설명:
#   alias     : 값이 담긴 JSON key 이름들. 중첩 안쪽도 이름만으로 찾는다(`detail.htmlText` → `htmlText`).
#               앞에 적은 것이 우선하며 대소문자·공백·`_-./`·전각/반각 차이는 무시하고 찾는다.
#               `alias: [$file]` 이면 입력 파일명(요청의 org_filename 우선)을 값으로 쓴다. 다른 별칭과
#               섞을 수 없으며, 필요한 부분은 regex_extract 로 잘라낸다(위 예시).
#   collect   : 한 레코드 안에서 여러 번 나오는 key 의 값을 모두 모아 배열로 만든다. alias 와 함께 쓸 수 없으며, to_text 를
#               붙이면 `- 항목` 목록이 된다.
#   raw       : 원천의 객체를 값으로 받는다(`{alias: [키], raw: true}`). to_json 과 함께 쓴다.
#   const     : 원천 값이 있어도 항상 이 값을 쓴다.
#   default   : 원천 값이 비었을 때만 채운다. `default: null` 이면 값이 없어도 컬럼을 null 로 출력한다.
#   values    : 값의 표기를 표준값으로 통일한다. 형식은 `표준값: [별칭…]` 이며 표준값 자신도 별칭이다.
#               대소문자·공백·`_-./`·전각/반각 차이는 무시하고 비교한다. 목록에 없는 값은 원래 값을
#               두고 경고만 남긴다. 영문 yes/no/on/off 별칭은 따옴표로 감싼다(YAML 이 true/false 로 읽는다).
#   keep      : 목록 값에서 적은 값만 남긴다(`keep: [A01, B02]`). 남은 값이 없으면 그 레코드는 적재하지 않는다. 비워 두면 전부 적재한다.
#   transform : 값 변환. 아래 [변환기] 참고.
#   template  : 여러 필드를 합쳐 새 필드를 만든다(`"{{L1}} > {{L2}}"`).
#   pack      : 여러 필드를 JSON 객체 문자열 하나로 묶는다(`[A, B]` → `{"A": ..., "B": ...}`).
#               이미 JSON 문자열이므로 to_json 을 덧붙이지 않는다. `llm.out` 필드도 묶을 수 있다.
#               본문 키(body.fields·repeat)에는 쓸 수 없다.
#   meta      : false 면 적재 컬럼에서만 뺀다(기본 true). template·pack 재료나 filter·require
#               조건으로만 쓰는 필드에 적는다.
#   seq       : 원천에 항목 번호가 없을 때 번호를 매긴다. `{prefix: "FAQ-", width: 4, start: 1}` →
#               FAQ-0001, FAQ-0002 … (`{}` 이면 1, 2, 3 …). filter·require 를 통과한 레코드에만 매긴다.
#
# [변환기] 인자는 `{name: <이름>, <인자>: <값>}` 으로 적는다.
#   date_int       on_error=0                        날짜 → YYYYMMDD 정수("2026-07-01"·"26.07.01"·"260701").
#                                                    빈 값은 항상 0, 해석 실패는 on_error
#   normalize                                        전각·반각 통일, 공백 정리, 소문자화(중복 판정 키용.
#                                                    영문이 소문자가 되므로 표시용 값에는 쓰지 않는다)
#   to_text                                          JSON·HTML 을 표·목록 구조를 살린 평문으로 바꾼다
#   regex_sub      pattern, repl=""                  정규식 치환
#   regex_extract  pattern, group=1, on_error=null   정규식 추출. 일치하지 않으면 on_error
#   to_int         on_error=null                     "18,000원" → 18000. 소수이거나 숫자가 둘 이상이면 on_error
#   percent                                          "분자/분모" → 백분율 정수(내림). "10600/25000" → 42
#   unique                                           목록에서 같은 값을 지움(처음 나온 순서 유지). 목록이 아니면 그대로
#   hash           length=16, prefix=""              해시코드로 변환(SHA-1)
#   truncate       length, suffix=""                 길이 자르기
#   to_json        on_scalar=wrap|drop, key="value"  JSON 컬럼용 문자열. 단일 값은 wrap(기본)이면 {key: 값},
#                                                    drop 이면 null. 목록 맨 뒤에만 두며 본문 키·pack 재료로
#                                                    쓸 수 없다
#
# ── [참고] 값 적용 순서 ──────────────────────────────────────────────────────
#   처리 순서: alias·collect·$file 매핑 → merge_rows → default → const → values → keep → transform → template
#   → filter → require → seq → llm → pack

# ── [선택] 값이 반드시 있어야 하는 필드(require) ────────────────────────────
# 값이 빈 레코드는 그 건만 건너뛴다. key 가 원천에 아예 없어도 요청은 실패하지 않는다.
# `llm` 이 만드는 필드는 적을 수 없다.
# require:
#   fields: [<TARGET_FIELD_1>]

# ── [선택] 값 조건 필터 ─────────────────────────────────────────────────────
# 조건을 모두 만족하는 레코드만 남긴다(AND). field 에는 `fields` 에 선언한 목표필드명만 쓸 수 있다.
# filter:
#   - {field: <DEL_YN>, not_in: [Y]}

# ── [필수] 청크 본문 ────────────────────────────────────────────────────────
# 예시:
body:
  fields: [<TARGET_FIELD_1>, <TARGET_FIELD_2>]
  # labels:
  #   <TARGET_FIELD_1>: <항목명>
  # split: true
  # repeat: [<TARGET_FIELD_1>]      # 예: TITLE, QUESTION

# 옵션 설명:
#   fields : 본문을 만들 필드. 적은 순서대로 줄바꿈으로 이어 붙이며 이 값이 embedding 입력이 된다.
#            본문이 모두 빈 레코드는 제외되므로 항상 값이 있는 필드(제목 등)를 앞에 둔다.
#   labels : 본문 필드를 `항목명: 값` 형태로 싣는다. 여기 적은 필드만 항목명이 붙고 나머지는 값만 나간다.
#   split  : true 면 본문이 chunk_size 를 넘을 때 여러 청크로 나눈다. 기본 false(레코드 1건 = 청크 1개).
#   repeat : 나뉜 모든 청크 앞에 반복할 식별 필드. `split: true` 일 때만 쓴다.

# ── [선택] LLM 으로 만드는 필드 ─────────────────────────────────────────────
# 레코드 1건당 1회 호출하므로 레코드가 많으면 비용·시간이 그만큼 늘어난다.
# out 이름은 프롬프트가 요구하는 JSON 키와 정확히 같아야 한다. 다르면 오류 없이 null 이 된다.
# out 필드는 `fields` 에 선언하지 않고 body·pack 에 바로 쓴다.
# llm:
#   - out: [<GENERATED_FIELD>]              # 만들 필드
#     in:  [<TARGET_FIELD_1>]               # 프롬프트 {{raw_text}} 에 넣을 필드
#     concurrency: 4                        # 동시 호출 상한(기본 4)
#     on_error: null                        # null(이 필드만 null 로 두고 진행) | skip_record(그 레코드를 제외)
#                                           # parse 설정 defaults.llm_call_failure: fail 이면 적용 안 함(LLM 호출 실패에서 중단)
#     parser: {type: json}
#
#     # 접속 정보는 model_presets.yaml 의 이름을 사용한다.
#     endpoint:
#       model_preset: default
#     params:                               # top_p·seed·repetition_penalty·headers 도 쓸 수 있다
#       max_tokens: 1000
#       temperature: 0.0
#       timeout: 120
#       # params: {top_k: 20}               # 모델 공급자 전용 값은 안쪽 params 에 적는다
#
#     prompt:
#       system: |
#         <역할>. 반드시 하나의 JSON 객체만 반환한다. 설명 문구·코드펜스 없이 순수 JSON 만 출력한다.
#         키는 `<GENERATED_FIELD>` 하나다.
#         원문에 없는 내용을 지어내지 않는다(환각 금지). 만들 것이 없으면 값을 null 로 둔다.
#
#         출력 예시 형식(값은 예시):
#         {"<GENERATED_FIELD>": "<예시 값>"}
#       user: |
#         <지시문>
#
#         반드시 `<GENERATED_FIELD>` 키를 가진 JSON 객체로만 반환하라.
#
#         <item>
#         {{raw_text}}
#         </item>

# ── [선택] 이 문서유형의 표 설명 설정(table_text_description) ───────────────
# 본문의 표(HTML·마크다운 표)마다 LLM 으로 검색용 설명을 만들어 표 앞에 붙이는 기능이다.
# config.yaml 공통 설정의 `table_text_description` 에 여기 적은 키만 덮어쓰고(`rag`·`skip` 안의 키도 하나씩 덮어쓴다),
# 적지 않은 키는 공통 설정 값을 그대로 쓴다.
# `enable`(기본 false)로 켜고 끈다. 요청 파라미터 table_text_desc 가 있으면 그 값이 우선한다.
# `skip` 으로 LLM 에 보내지 않을 표 종류를 정한다(종류와 기준은 config.yaml 의 table_text_description 주석 참고).
# 레코드 본문 안의 표에도 설명이 붙으며, 필드 추출과 별도로 호출한다.
# table_text_description:
#   enable: true
#   prompt_template_file: prompt_table_text_description_rag.md   # 표 설명 프롬프트 파일(같은 폴더 기준)
#   before_items: 4                   # 표 앞에서 문맥으로 가져올 본문 항목 수(기본 3)
#   after_items: 3                    # 표 뒤에서 문맥으로 가져올 본문 항목 수(기본 2)
#   skip:
#     self_describing_table: true     # 제목이 있고 값이 문장인 작은 표
#     long_text_table: 100            # 값 칸 평균 글자 수가 이 값 이상인 표(0 이면 끔)
#   rag:
#     key_fact_limit: 5               # 표에서 뽑을 핵심 사실 최대 개수(기본 3)
#     search_terms: 3                 # 청크에 실을 검색어 수(0 이면 만들지 않음)
