# ═══════════════════════════════════════════════════════════════════════════
#  템플릿 — 중첩 JSON 을 성격별 섹션 청크로 (source.kind: sections)
#
#  용도      : JSON 파일 하나가 대상 하나(상품 1건, 카드 1장, 문서 1건)를 설명하고, 그 안에
#              성격이 다른 내용(기본정보·혜택·안내문·추천상품 등)이 섞여 있을 때.
#              파일 하나에 같은 형태의 레코드가 여러 건이면 records 를 쓴다.
#  결과      : 성격별로 나뉜 섹션 하나가 청크 하나가 된다. 모든 청크에 공통 정보(상품명·상품코드
#              등)가 함께 실려 어느 청크가 검색되어도 대상을 알 수 있다.
#  LLM 호출  : 없음. 원천에 없는 필드가 필요할 때만 아래 `llm` 블록을 쓴다(문서 1건당 1회).
#
#  ── 작성 순서 ────────────────────────────────────────────────────────────
#  ① 이 파일을 parse activity 설정 폴더(config.yaml 이 있는 폴더)에 custom_field_<유형>.yaml 로
#     복사한다.
#  ② <...> 를 채우고 쓰지 않는 [선택] 블록은 지운다. `schema: v2` 줄은 지우지 않는다(없으면 기동 실패).
#  ③ 이 파일 최상위에 `doc_type: <유형>` 한 줄을 적는다. 이 한 줄이 등록이고 파일을 지우면 빠진다
#     (Studio 의 문서유형 추가도 이 방식이다). 같은 설정 폴더를 읽는 모든 처리기에 등록되며,
#     처리기 설정(config.yaml 등)에는 아무것도 적지 않는다. extractor 도 적지 않는다(source.kind 로 정해진다).
#
#  ── 작성 요점 ────────────────────────────────────────────────────────────
#  사람이 정하는 것은 `fields`(모든 청크에 넣을 공통 정보), `source.sections`(key 별 표시 이름),
#  `source.ignore_keys`(검색에서 뺄 key) 세 가지이고 나머지는 자동으로 처리된다.
#  `ignore_keys` 에 적지 않은 key 는 모두 검색 본문에 들어간다.
# ═══════════════════════════════════════════════════════════════════════════

schema: v2

# ── [필수] 소스 ─────────────────────────────────────────────────────────────
source:
  kind: sections

  # ── [선택] JSON key 별 표시 이름 ──────────────────────────────────────────
  # 왼쪽은 JSON key 이름(경로가 아니라 이름만), 오른쪽은 청크 본문 앞에 `[<이름>]` 으로 표시할 이름이다.
  # 하위 key 에 따로 적지 않으면 자식도 이 이름을 물려받는다.
  # sections:
  #   <SECTION_KEY_1>: <섹션 표시 이름>
  #   <SECTION_KEY_2>: <섹션 표시 이름>

  # ── [선택] 검색에서 뺄 key ────────────────────────────────────────────────
  # 다른 대상의 내용(추천 상품 등)이나 검색할 일이 없는 값(이미지 경로·색상 등)을 적는다.
  # 그 key 아래 전체가 빠진다. `*` 로 부분 일치를 쓸 수 있으며 대소문자를 구분한다.
  # ignore_keys:
  #   - <RELATED_ITEM_KEY>   # 다른 대상의 내용
  #   - "*Img*"
  #   - <제외할_KEY>

  # ── [선택] 아래 `require.fields` 값이 비었을 때 ────────────────────────────
  # error(기본) = 요청 실패 / skip = 경고 후 섹션 0건
  # on_missing: error

# ── [필수] 필드 — 모든 청크에 넣을 공통 정보 ──────────────────────────────────
# 왼쪽은 목표필드명이며 적재 DB 컬럼명(대문자)으로 쓴다. 값은 항상 object 로 적는다.
# 여기서 만든 값은 모든 청크의 metadata 에 실린다.
#
# 예시(왼쪽 <...> 는 목표필드명, alias 안은 원천 key 이름):
fields:
  <TARGET_FIELD_1>:
    alias: [<json key>, <다른 표기>]
  <TARGET_FIELD_2>:
    alias: [<json key>]
  # <GROUP_C>: {const: "<고정값>"}
  # <SALE_STATUS>:
  #   alias: [saleStatus]
  #   values: {ON_SALE: ["1", Y, 판매중], OFF_SALE: ["0", N, 판매중지]}
  #   default: ON_SALE
  # <ANNUAL_FEE>:
  #   alias: [feeAmount]
  #   transform: to_int                                   # "18,000원" → 18000
  # <DISPLAY_NM>:
  #   template: "{{<TARGET_FIELD_1>}} {{<TARGET_FIELD_2>}}"   # 위에서 선언한 필드만 쓸 수 있다
  # <PRODUCT_ATTRS>: {pack: [<ANNUAL_FEE>, <TARGET_FIELD_2>]}  # llm 블록을 쓰면 llm.out 필드도 묶을 수 있다

# 옵션 설명:
#   alias     : 값이 든 최상위 JSON key 이름들. 중첩 안쪽은 찾지 않는다. 앞에 적은 것이 우선하며
#               대소문자·공백·`_-./`·전각/반각 차이는 무시하고 찾는다.
#   raw       : 값이 객체인 key 를 그대로 받는다(raw 가 없으면 객체 값은 null). to_json 과 함께 쓴다.
#   const     : 원천 값이 있어도 항상 이 값을 쓴다.
#   default   : 원천 값이 비었을 때만 채운다.
#   values    : 값의 표기를 표준값으로 통일한다. 형식은 `표준값: [별칭…]` 이며 표준값 자신도 별칭이다.
#               대소문자·공백·`_-./`·전각/반각 차이는 무시하고 비교한다. 목록에 없는 값은 원래 값을
#               두고 경고만 남긴다. 영문 yes/no/on/off 별칭은 따옴표로 감싼다(YAML 이 true/false 로 읽는다).
#   transform : 값 변환. 아래 [변환기] 참고.
#   template  : 여러 필드를 합쳐 새 필드를 만든다(`"{{L1}} > {{L2}}"`).
#   pack      : 여러 필드를 JSON 객체 문자열 하나로 묶는다(`[A, B]` → `{"A": ..., "B": ...}`).
#               이미 JSON 문자열이므로 to_json 을 덧붙이지 않는다. `llm.out` 필드도 묶을 수 있다.
#               본문 키(body.fields·once)에는 쓸 수 없다.
#   meta      : false 면 적재 컬럼에서만 뺀다(기본 true). template·pack 재료나 require 조건으로만
#               쓰는 필드에 적는다.
#
# [변환기] 인자는 `{name: <이름>, <인자>: <값>}` 으로 적는다.
#   date_int       on_error=0                        날짜 → YYYYMMDD 정수("2026-07-01"·"26.07.01"·"260701").
#                                                    빈 값은 항상 0, 해석 실패는 on_error
#   normalize                                        전각·반각 통일, 공백 정리, 소문자화(중복 판정 키용.
#                                                    영문이 소문자가 되므로 표시용 값에는 쓰지 않는다)
#   to_text                                          JSON·HTML 을 표·목록 구조를 살린 평문으로 바꾼다
#   regex_sub      pattern, repl=""                  정규식 치환
#   regex_extract  pattern, group=1, on_error=null   정규식 추출. 일치하지 않으면 on_error
#   to_int         on_error=null                     "18,000원" → 18000. 소수이거나 숫자가 둘 이상이면 on_error
#   percent                                          "분자/분모" → 백분율 정수(내림). "10600/25000" → 42
#   unique                                           목록에서 같은 값을 지움(처음 나온 순서 유지). 목록이 아니면 그대로
#   hash           length=16, prefix=""              해시코드로 변환(SHA-1)
#   truncate       length, suffix=""                 길이 자르기
#   to_json        on_scalar=wrap|drop, key="value"  JSON 컬럼용 문자열. 단일 값은 wrap(기본)이면 {key: 값},
#                                                    drop 이면 null. 목록 맨 뒤에만 두며 본문 키·pack 재료로
#                                                    쓸 수 없다
#
# ── [참고] 값 적용 순서 ──────────────────────────────────────────────────────
#   처리 순서: 최상위 원천값 → default → const → values → transform → template → pack
#   → require → 섹션 생성 → llm → pack 다시 적용

# ── [선택] 값이 반드시 있어야 하는 필드(require) ────────────────────────────
# 여기 적은 필드의 값이 비면 `source.on_missing` 에 따라 요청을 실패시키거나(기본) 섹션 0건으로 끝낸다.
# `llm` 이 만드는 필드는 적을 수 없다.
# require:
#   fields: [<TARGET_FIELD_1>]

# ── [선택] 청크 본문 ────────────────────────────────────────────────────────
# 예시:
# body:
#   fields: [<TARGET_FIELD_1>, <TARGET_FIELD_2>]
#   labels:
#     <TARGET_FIELD_1>: <항목명>
#     <TARGET_FIELD_2>: <항목명>
#   once: [<ANNUAL_FEE>]
#
# 옵션 설명:
#   fields : 청크 본문 맨 앞에 실을 공통 필드. 적지 않은 필드는 metadata 에만 남는다.
#            생략하면 labels 에 있는 필드가 실리고, 아무것도 싣지 않으려면 `fields: []` 로 적는다.
#   labels : 본문 앞과 once 로 싣는 필드에 붙일 항목명(`항목명: 값`). 없으면 값만 실린다.
#   once   : 문서에 하나뿐인 값(연회비·작성일 등)을 첫 청크에만 싣는다. 값은 모든 청크의 metadata 에
#            실리므로 모든 청크에서 필터 검색할 수 있다.

# ── [선택] LLM 으로 만드는 필드 ─────────────────────────────────────────────
# 문서 1건당 1회 호출하고 그 결과를 모든 섹션에 같은 값으로 싣는다.
# `in` 에는 `fields` 의 목표필드명, `PRODUCT_INFO`(문서 전체를 뜻하는 예약 이름), JSON key 이름(그 key 아래
# 본문만) 중에서 적는다.
# out 이름은 프롬프트가 요구하는 JSON 키와 정확히 같아야 한다. 다르면 오류 없이 null 이 된다.
# out 필드는 `fields` 에 선언하지 않고 body·pack 에 바로 쓴다.
# llm:
#   - out: [<GENERATED_FIELD>]
#     in:  [<JSON_KEY>]                       # 예: feeUrl. 문서 전체는 PRODUCT_INFO
#     parser: {type: json}
#
#     # 접속 정보는 model_presets.yaml 의 이름을 사용한다.
#     endpoint:
#       model_preset: default
#     params:                                 # top_p·seed·repetition_penalty·headers 도 쓸 수 있다
#       max_tokens: 1000
#       temperature: 0.0
#       timeout: 120
#       # params: {top_k: 20}                 # 모델 공급자 전용 값은 안쪽 params 에 적는다
#
#     prompt:
#       system: |
#         <역할>. 반드시 하나의 JSON 객체만 반환한다. 설명 문구·코드펜스 없이 순수 JSON 만 출력한다.
#         키는 `<GENERATED_FIELD>` 하나다.
#         원문에 없는 내용을 지어내지 않는다(환각 금지). 만들 것이 없으면 값을 null 로 둔다.
#
#         출력 예시 형식(값은 예시):
#         {"<GENERATED_FIELD>": "<예시 값>"}
#       user: |
#         <지시문>
#
#         반드시 `<GENERATED_FIELD>` 키를 가진 JSON 객체로만 반환하라.
#
#         <document>
#         {{raw_text}}
#         </document>

# ── [선택] 이 문서유형의 표 설명 설정(table_text_description) ───────────────
# 본문의 표(HTML·마크다운 표)마다 LLM 으로 검색용 설명을 만들어 표 앞에 붙이는 기능이다.
# config.yaml 공통 설정의 `table_text_description` 에 여기 적은 키만 덮어쓰고(`rag`·`skip` 안의 키도 하나씩 덮어쓴다),
# 적지 않은 키는 공통 설정 값을 그대로 쓴다.
# `enable`(기본 false)로 켜고 끈다. 요청 파라미터 table_text_desc 가 있으면 그 값이 우선한다.
# `skip` 으로 LLM 에 보내지 않을 표 종류를 정한다(종류와 기준은 config.yaml 의 table_text_description 주석 참고).
# 섹션 본문 안의 표에도 설명이 붙으며, 필드 추출과 별도로 호출한다.
# table_text_description:
#   enable: true
#   prompt_template_file: prompt_table_text_description_rag.md   # 표 설명 프롬프트 파일(같은 폴더 기준)
#   before_items: 4                   # 표 앞에서 문맥으로 가져올 본문 항목 수(기본 3)
#   after_items: 3                    # 표 뒤에서 문맥으로 가져올 본문 항목 수(기본 2)
#   skip:
#     self_describing_table: true     # 제목이 있고 값이 문장인 작은 표
#     long_text_table: 100            # 값 칸 평균 글자 수가 이 값 이상인 표(0 이면 끔)
#   rag:
#     key_fact_limit: 5               # 표에서 뽑을 핵심 사실 최대 개수(기본 3)
#     search_terms: 3                 # 청크에 실을 검색어 수(0 이면 만들지 않음)
